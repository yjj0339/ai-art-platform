<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="AI创意设计思维平台，面向创意设计与表达场景的AI创作工具。" />
    <!--
      平板「添加到主屏幕」后按独立 App 打开：没有地址栏、没有浏览器导航条，画纸能多出约 80~100px 高度。
      iOS 认 apple-mobile-web-app-capable，安卓认 manifest 里的 display:standalone。
      必须保留 viewport-fit=cover，否则组件里的 env(safe-area-inset-*) 全是 0，全屏时会被刘海压住。
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AI创意设计" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AI创意设计思维平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
