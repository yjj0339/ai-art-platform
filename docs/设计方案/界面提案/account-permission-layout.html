<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号权限管理排版提案</title>
  <style>
    :root { --navy:#172235; --navy-2:#202d43; --ink:#172033; --muted:#718096; --line:#e6ebf2; --canvas:#f5f7fb; --accent:#f97316; --accent-soft:#fff1e8; --green:#16856e; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:Inter,"Microsoft YaHei",Arial,sans-serif; }
    button,input { font:inherit; }
    .app { min-height:100vh; display:grid; grid-template-columns:220px minmax(0,1fr); }
    aside { background:var(--navy); color:#d7dfec; padding:25px 16px; }
    .brand { padding:0 12px 25px; border-bottom:1px solid #334158; }
    .brand b { display:block; color:#fff; font-size:18px; letter-spacing:.3px; }
    .brand span { display:block; margin-top:5px; color:#8c9ab0; font-size:12px; }
    nav { display:grid; gap:7px; margin-top:22px; }
    nav button { border:0; background:transparent; color:#9eabc0; text-align:left; padding:11px 12px; border-radius:7px; cursor:pointer; }
    nav button.active { background:#2d3a51; color:#fff; }
    nav button span { display:inline-block; width:28px; color:#a8b5c9; font-size:12px; font-weight:800; }
    main { min-width:0; padding:30px 34px 42px; }
    .crumb { color:#8a96a8; font-size:12px; margin-bottom:18px; }
    .title-row { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:22px; }
    h1 { margin:0; font-size:26px; letter-spacing:0; }
    .title-row p { margin:7px 0 0; color:var(--muted); font-size:13px; }
    .primary { border:0; border-radius:6px; background:var(--accent); color:#fff; padding:10px 15px; font-weight:800; cursor:pointer; box-shadow:0 5px 12px #f9731626; }
    .shell { background:#fff; border:1px solid var(--line); border-radius:9px; overflow:hidden; box-shadow:0 10px 26px #1923380a; }
    .main-tabs { display:flex; gap:30px; padding:0 24px; border-bottom:1px solid var(--line); }
    .main-tabs button { position:relative; border:0; background:transparent; color:#7b8798; padding:17px 2px 15px; font-weight:800; cursor:pointer; }
    .main-tabs button.active { color:var(--ink); }
    .main-tabs button.active:after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:3px; background:var(--accent); border-radius:3px 3px 0 0; }
    .content { padding:20px 24px 24px; }
    .sub-row { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; }
    .sub-tabs { display:flex; gap:8px; flex-wrap:wrap; }
    .sub-tabs button { border:1px solid transparent; border-radius:5px; background:#f4f6fa; color:#657286; padding:8px 13px; cursor:pointer; font-size:13px; font-weight:700; }
    .sub-tabs button.active { border-color:#ffd5bd; background:var(--accent-soft); color:#d95710; }
    .tools { display:flex; align-items:center; gap:9px; }
    .search { min-width:210px; border:1px solid var(--line); border-radius:5px; padding:9px 11px; outline:none; }
    .filter { border:1px solid var(--line); background:#fff; border-radius:5px; padding:9px 12px; color:#526074; cursor:pointer; }
    .summary { display:flex; gap:20px; align-items:center; color:var(--muted); font-size:12px; margin:4px 0 14px; }
    .summary b { color:var(--ink); font-size:15px; }
    .table-wrap { border:1px solid var(--line); border-radius:7px; overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:760px; }
    th { background:#f8fafc; color:#7b8798; font-size:12px; text-align:left; font-weight:800; padding:12px 14px; }
    td { border-top:1px solid var(--line); padding:14px; font-size:13px; color:#475569; vertical-align:middle; }
    tr:hover td { background:#fcfdff; }
    .account { display:flex; align-items:center; gap:10px; }
    .avatar { width:32px; height:32px; display:grid; place-items:center; border-radius:7px; background:#eaf0f8; color:#3e5878; font-size:12px; font-weight:900; }
    .account strong { display:block; color:var(--ink); font-size:13px; }
    .account small { display:block; margin-top:4px; color:#98a3b2; font-size:11px; }
    .group { color:#53657b; }
    .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:5px 9px; background:#eaf8f3; color:var(--green); font-size:11px; font-weight:800; }
    .badge:before { content:""; width:6px; height:6px; border-radius:50%; background:#24a47f; }
    .checks { display:flex; gap:11px; flex-wrap:wrap; color:#657286; font-size:11px; }
    .checks label { display:flex; gap:5px; align-items:center; white-space:nowrap; }
    .checks input { accent-color:var(--accent); }
    .note { display:none; padding:22px; color:var(--muted); }
    @media (max-width:820px) { .app { grid-template-columns:72px minmax(0,1fr); } aside { padding:18px 9px; } .brand { padding:0 5px 18px; } .brand b { font-size:14px; } .brand span, nav button:not(.active) { display:none; } nav button { text-align:center; padding:11px 5px; } nav button span { width:auto; } main { padding:20px 16px; } .title-row { align-items:start; flex-direction:column; } .content { padding:16px; } .sub-row { align-items:start; flex-direction:column; } .tools, .search, .filter { width:100%; } .tools { flex-direction:column; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><b>美佳美画</b><span>后台管理中心</span></div>
      <nav>
        <button><span>数</span>数据大盘</button>
        <button class="active"><span>权</span>账号权限</button>
        <button><span>课</span>课程库管理</button>
        <button><span>模</span>报告模板</button>
        <button><span>接</span>API 配置</button>
      </nav>
    </aside>
    <main>
      <div class="crumb">管理后台 / 账号权限</div>
      <div class="title-row"><div><h1>账号权限管理</h1><p>按账号或权限组统一管理功能访问范围</p></div></div>
      <section class="shell">
        <div class="main-tabs"><button class="active" data-panel="accounts">账号列表</button><button data-panel="groups">权限组</button></div>
        <div class="content" id="accounts-panel">
          <div class="sub-row"><div class="tools"><span class="filter-label">账号类型</span><select class="filter"><option>全部账号</option><option>学生端账号</option><option>老师端账号</option><option>家长端账号</option><option>管理员账号</option></select></div></div>
          <div class="summary"><span><b>186</b> 个账号</span><span>启用 178</span><span>待处理 8</span></div>
          <div class="table-wrap"><table><thead><tr><th>账号</th><th>绑定关系 / 权限组</th><th>账号状态</th><th>独立权限</th></tr></thead><tbody>
            <tr><td><div class="account"><span class="avatar">林</span><span><strong>林老师</strong><small>teacher · 金碧花园校区</small></span></div></td><td class="group">课程教研组</td><td><span class="badge">已启用</span></td><td><div class="checks"><label><input type="checkbox" checked> 查看课程库</label><label><input type="checkbox" checked> 上传课程</label></div></td></tr>
            <tr><td><div class="account"><span class="avatar">小</span><span><strong>小画家 186</strong><small>student · AI创意美术A班</small></span></div></td><td class="group">学生基础权限</td><td><span class="badge">已启用</span></td><td><div class="checks"><label><input type="checkbox" checked> 使用课程</label><label><input type="checkbox"> 项目报告</label></div></td></tr>
            <tr><td><div class="account"><span class="avatar">周</span><span><strong>周女士</strong><small>parent · 绑定 1 名学生</small></span></div></td><td class="group">家长查看组</td><td><span class="badge">已启用</span></td><td><div class="checks"><label><input type="checkbox" checked> 进入家长端</label></div></td></tr>
          </tbody></table></div>
        </div>
        <div class="note" id="groups-panel">切换到“权限组”后，下方展示现有权限组列表与编辑器。</div>
      </section>
    </main>
  </div>
  <script>
    document.querySelectorAll('.main-tabs button').forEach((button) => button.addEventListener('click', () => {
      document.querySelectorAll('.main-tabs button').forEach((item) => item.classList.toggle('active', item === button));
      const accounts = button.dataset.panel === 'accounts';
      document.querySelector('#accounts-panel').style.display = accounts ? 'block' : 'none';
      document.querySelector('#groups-panel').style.display = accounts ? 'none' : 'block';
    }));
  </script>
</body>
</html>
